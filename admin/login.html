<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 Not Found</title>
<style>
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { font-family: "Times New Roman", Times, serif; padding: 8px; }
  h1 { font-size: 1.5em; font-weight: bold; margin: 0 0 0.5em 0; }
  .cursor {
    display: inline-block;
    width: 1px;
    height: 1.1em;
    background: #000;
    vertical-align: text-bottom;
    animation: blink 1s step-start infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  #pw {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    border: none;
    outline: none;
    background: transparent;
    caret-color: transparent;
    font-size: 16px;
    padding: 0;
    margin: 0;
  }
</style>
</head>
<body>
  <h1>Error 404: This page does not exist</h1>
  <div><span class="cursor"></span></div>
  <input id="pw" type="password" autofocus autocomplete="off" spellcheck="false" />
  <script>
    const input = document.getElementById('pw');
    input.focus();
    window.addEventListener('click', () => input.focus());
    window.addEventListener('touchstart', () => input.focus());
    input.addEventListener('blur', () => setTimeout(() => input.focus(), 0));
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (input.value === 'Admin@6247') {
          window.location.href = 'dashboard.html';
        } else {
          input.value = '';
        }
      }
    });
  </script>
</body>
</html>
